<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<title>Question Bank</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>📚 COL1000 Question Bank</h1>

<p>
Browse questions freely and practice in any order.
</p>

<div id="all-questions"></div>

</div>

<script>

const topics = [
    "variables",
    "conditionals",
    "loops",
    "lists"
];

const container =
    document.getElementById("all-questions");

Promise.all(

    topics.map(t =>
        fetch(`questions/${t}.json`)
        .then(r=>r.json())
    )

).then(data=>{

    data.forEach((questions,index)=>{

        const topic = topics[index];

        let html = `
        <section class="topic-section">

        <h2>
        ${topic.toUpperCase()}
        </h2>
        `;

        ["easy","medium","hard"].forEach(level=>{

            html += `
            <h3 class="${level}">
            ${level.toUpperCase()}
            </h3>
            `;

            questions
            .filter(q=>q.level===level)
            .forEach((q,id)=>{

                html += `
                <div class="bank-question">

                <p>
                <strong>
                ${id+1}.
                </strong>

                ${q.question}
                </p>

                <pre>
${q.code}
                </pre>

                <details>

                <summary>
                Show Answer
                </summary>

                <p>
                ${q.choices[q.answer]}
                </p>

                </details>

                </div>
                `;
            });
        });

        html += "</section>";

        container.innerHTML += html;
    });

});

</script>

</body>
</html>
