<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Artwork — Your Art Corner</title>
  <meta name="description" content="Details of an artwork from Your Art Corner." />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Kalam:wght@400;700&family=Mulish:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#artwork">Skip to the artwork</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html" aria-label="Your Art Corner — home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="42" height="42" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
            <path d="M24 6c3.6 4.8 6 8.4 6 11.4 0 3-2.7 5.1-6 5.1s-6-2.1-6-5.1C18 14.4 20.4 10.8 24 6Z"/>
            <path d="M24 42c-6 0-11-3.2-11-8.2 0-3.4 2.6-5.8 6-5.8 2.2 0 4.1 1.2 5 3 .9-1.8 2.8-3 5-3 3.4 0 6 2.4 6 5.8 0 5-5 8.2-11 8.2Z"/>
            <path d="M12 25c4.5 0 7 2 7 4.5M36 25c-4.5 0-7 2-7 4.5"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">Your Art Corner</span>
          <span class="brand-tag">Folk · Colour · Story</span>
        </span>
      </a>

      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Gallery</a>
        <a href="about.html">The Artist</a>
        <a class="nav-ig" href="https://www.instagram.com/your.art.corner.6" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/>
          </svg>
          Instagram
        </a>
      </nav>
    </div>
  </header>

  <main class="artwork-page">
    <div class="wrap">
      <a class="back-link" href="index.html">
        <span aria-hidden="true">&larr;</span> Back to the gallery
      </a>

      <div id="artwork" class="artwork-root">
        <p class="gallery-status">Loading artwork…</p>
      </div>

      <noscript>
        <p class="error-box">
          This page needs JavaScript to load artwork details from
          <code>data/artworks.csv</code>. Please enable JavaScript, or
          <a href="https://www.instagram.com/your.art.corner.6" target="_blank" rel="noopener">view the collection on Instagram</a>.
        </p>
      </noscript>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div class="divider" aria-hidden="true">
        <svg viewBox="0 0 240 24" width="200" height="24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
          <path d="M0 12h82"/><path d="M158 12h82"/>
          <path d="M120 3c6 4 9 6 9 9s-3 5-9 9c-6-4-9-6-9-9s3-5 9-9Z"/>
          <circle cx="120" cy="12" r="1.6" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <p class="footer-brand">Your Art Corner</p>
      <a class="footer-ig" href="https://www.instagram.com/your.art.corner.6" target="_blank" rel="noopener">@your.art.corner.6</a>
      <p class="footer-note">
        All artwork © <span id="year">2025</span> Your Art Corner. Please do not reproduce without permission.
      </p>
    </div>
  </footer>

  <script src="js/csv.js" defer></script>
  <script src="js/site.js" defer></script>
  <script src="js/artwork.js" defer></script>

</html>
